# 标准训练配置 - 完整功能 + 完整训练参数
# 使用方法: python main.py --config configs/params.yaml
# 
# 🚀 完整功能:
# - ✅ 区域搜索管理 (SearchRegionManager)
# - ✅ 前沿探测奖励 (FrontierManager) 
# - ✅ 目标发现奖励 (巨大奖励+50.0)
# - ✅ 协同机制 (CoordinationManager)
# - ✅ 障碍物避障系统 (ObstacleManager + 智能逃生策略)
# - ✅ 9层状态表示 (概率图+发现历史+探索强度)
# - ✅ 多层奖励架构 (解决稀疏奖励问题)
#
# 📊 标准训练参数:
# - Budget: 14步 (标准)
# - Episodes: 1500 (标准)
# - 预计时间: 24-36小时
# - 模型性能: ~95-100%

# ==================== 路径配置 ====================
paths:
  # 日志存储路径 (可以是绝对路径或相对于marl_framework的路径)
  log_dir: "log"                    # 默认: marl_framework/log
  # 结果存储路径 (可以是绝对路径或相对于marl_framework的路径)  
  results_dir: "res"                # 默认: marl_framework/res
  
  # 示例其他配置:
  # log_dir: "E:/my_logs"           # 绝对路径
  # results_dir: "../paper_results" # 相对于marl_framework的上级目录
  # log_dir: "/tmp/marl_logs"       # Linux绝对路径

environment:
  num_envs: 2
  seed: 3
  x_dim: 50
  y_dim: 50

sensor:
  type: "rgb_camera"
  field_of_view:
    angle_x: 60
    angle_y: 60
  pixel:
    number_x: 57
    number_y: 57
  encoding: "rgb8"
  model:
    type: "altitude_dependent"
    coeff_a: 0.05
    coeff_b: 0.2
  simulation:
    type: "random_field"
    cluster_radius: 5
    # 地图生成方式:
    # - 用 region_based 展示"有先验信息时的高效搜索"
    # - 用 random_field 展示"无先验信息时的鲁棒搜索"
    # - 对比分析：先验信息的价值
    # - "random_field": 使用原始随机场生成（独立于 search_regions）
    # - "region_based": 根据 search_regions 配置生成目标分布
    map_type: "region_based"  # 改为 "random_field" 可切换回随机模式

mapping:
  prior: 0.5

# ==================== 搜索区域定义 ====================
search_regions:
  regions:
    - name: "high_priority_zone"
      type: "rectangle"
      priority: 1.0
      min_coverage: 0.90
      coordinates: [[10, 10, 25, 25]]
      search_density: "high"
      target_probability: 0.6
      
    - name: "medium_priority_zone"
      type: "rectangle"
      priority: 0.6
      min_coverage: 0.80
      coordinates: [[30, 10, 45, 25]]
      search_density: "medium"
      target_probability: 0.3
      
    - name: "low_priority_zone"
      type: "rectangle"
      priority: 0.3
      min_coverage: 0.65
      coordinates: [[10, 30, 45, 45]]
      search_density: "low"
      target_probability: 0.1
  
  strategy:
    mode: "priority_based"
    allow_overlap: false
    revisit_threshold: 0.1
    completion_threshold: 0.85
  
  density_requirements:
    high: 3
    medium: 2
    low: 1

experiment:
  title: "region_search_training"
  constraints:
    spacing: 3       # 减小步长（从5改为3）：让路径更密集、更曲折
    min_altitude: 5
    max_altitude: 25
    budget: 50               # 增加到50步（从35），支持更充分的区域搜索
    num_actions: 27          # 使用27动作空间（从6改为27）：3D立体搜索能力
  uav:
    max_v: 5
    max_a: 2
    sampling_time: 2
    communication_range: 25
    fix_range: True
    failure_rate: 0
  missions:
    type: "COMA"
    mission_mode: "training"
    n_episodes: 1200          # 增加训练轮数（从1000到1500）
    patience: 150
    n_agents: 4
    action_space: "larger"
    planning_uncertainty: "SE"
    eps_max: 0.8             # 提高探索率（从0.7到0.8）：更多探索
    eps_min: 0.15            # 提高最小探索率（从0.05到0.15）：保持持续探索
    eps_anneal_phase: 50000  # 延长探索衰减（覆盖大部分训练过程）
    use_eps: True
    class_weighting: [0, 1] 
    reward_normalization: false
  coverage_weight: 3.0         # 大幅提高覆盖率权重（从0.15到3.0）：鼓励全面搜索
  distance_weight: -0.5        # 添加距离惩罚（从0.0到-0.5）：避免无效移动
  footprint_weight: 0.0        # 降低足迹惩罚（从0.5到0.0）：允许重复搜索高优先级区域
  collision_weight: 3.0        # 降低碰撞惩罚（从2.0到3.0）：适度强调避障
  collision_distance: 5.0
  altitude_diversity_weight: 2.0  # 大幅提高高度多样性（从0.5到2.0）：鼓励3D立体搜索
  
  # ==================== 能耗惩罚 ====================
  energy_cost_per_step: 0.02      # 大幅降低能耗惩罚（从0.04降到0.02）：鼓励充分搜索
  
  # ==================== 障碍物避障配置 ====================
  obstacles:
    enable: true                    # 启用障碍物避障功能
    safety_margin: 1.2              # 提高安全边界（从0.5提高到1.2）：更安全的避障
    collision_penalty: 8.0          # 提高碰撞惩罚（从5.0提高到8.0）：强化避障意识
    obstacle_penalty_weight: 0.5    # 提高距离惩罚（从0.1到0.5）：早期规避障碍物
    
    # 固定障碍物列表 - 与visualization.obstacles对应
    # 这些障碍物会影响UAV的路径规划和动作选择
    fixed_obstacles:
      # 原有障碍物（与可视化保持一致）
      - x: 15.0
        y: 25.0
        z: 0.0
        height: 12.0
        radius: 2.75      # 圆柱形障碍物半径
      
      - x: 35.0
        y: 15.0
        z: 0.0
        height: 15.0
        radius: 2.75
      
      - x: 25.0
        y: 40.0
        z: 0.0
        height: 10.0
        radius: 2.75
      
      # 高优先级区域附近的障碍物
      - x: 20.0
        y: 12.0
        z: 0.0
        height: 8.0
        radius: 2.75
      
      - x: 12.0
        y: 22.0
        z: 0.0
        height: 14.0
        radius: 2.75
      
      # 中优先级区域的障碍物
      - x: 38.0
        y: 18.0
        z: 0.0
        height: 11.0
        radius: 2.75
      
      - x: 42.0
        y: 22.0
        z: 0.0
        height: 9.0
        radius: 2.75
      
      # 区域连接处的障碍物
      - x: 28.0
        y: 18.0
        z: 0.0
        height: 13.0
        radius: 2.75
      
      - x: 18.0
        y: 32.0
        z: 0.0
        height: 16.0
        radius: 2.75
      
      - x: 40.0
        y: 38.0
        z: 0.0
        height: 7.0
        radius: 2.75
  
  # ==================== 新设计1: 内在奖励机制 (解决稀疏奖励) ====================
  intrinsic_rewards:
    enable: true
    
    # 1.1 前沿探测驱动 (核心创新)
    frontier_reward_weight: 5.0      # 巨幅增强前沿探测奖励（从2.5提高到5.0）：驱动探索边界
    frontier_detection_threshold: 0.3
    
    # 1.2 覆盖率驱动
    coverage_exploration_weight: 4.0  # 巨幅增强覆盖探索（从2.0提高到4.0）：密集搜索
    coverage_decay_factor: 0.90       # 降低衰减因子（从0.95到0.90）：鼓励新区域探索
    
    # 1.3 搜索完备性奖励
    completeness_weight: 1.0          # 大幅增强完备性奖励（从0.5提高到1.0）
    confidence_threshold: 0.8
  
  # ==================== 新设计2: 协同机制 ====================
  coordination:
    enable: true
    
    # 抗重叠惩罚
    overlap_penalty_weight: 2.0      # 提高重叠惩罚（从1.2到2.0）：避免路径重叠
    overlap_threshold: 0.25          # 降低重叠阈值（从0.3到0.25）：更严格
    
    # 区域分工奖励
    division_reward_weight: 2.0      # 大幅提高分工奖励（从0.6到2.0）：鼓励分区搜索
    region_assignment_bonus: 2.0     # 大幅提高分配奖励（从0.8到2.0）
    
    # 协同发现奖励
    joint_discovery_weight: 3.0      # 大幅提高协同奖励（从1.5到3.0）
    collaboration_distance: 20.0     # 增大协作距离（从15到20）
    
    # 通信效率
    communication_cost: 0.005        # 降低通信成本（从0.01到0.005）
  
  # ==================== 新设计3: 目标发现奖励机制 ==================== 
  target_discovery_reward: 100.0    # 大幅增加发现奖励(从50提高到100)
  mission_success_reward: 200.0     # 大幅增加成功奖励(从100提高到200)
  mission_failure_penalty: -20.0    # 降低失败惩罚(从-50到-20)
  collaborative_discovery_weight: 50.0  # 增加协同发现奖励(从25提高到50)
  discovery_threshold: 0.8          # 保持发现阈值
  
  # ==================== 新设计4: 区域搜索奖励 ==================== 
  region_coverage_weight: 10.0       # 巨幅增强区域覆盖奖励（从5.0提高到10.0）：核心目标
  region_priority_weight: 10.0       # 巨幅增强优先级奖励（从5.0提高到10.0）：优先搜索重点区域
  search_density_weight: 5.0         # 巨幅增强搜索密度奖励（从2.0提高到5.0）：密集覆盖
  search_completion_weight: 8.0      # 巨幅增强完成奖励（从3.0提高到8.0）：完成区域搜索
  redundant_search_penalty: -0.05    # 大幅降低冗余惩罚（从-0.2到-0.05）：允许重复搜索重点区域
  region_transition_penalty: -0.02   # 大幅降低转换惩罚（从-0.1到-0.02）：灵活切换区域
  
  baselines:
    lawnmower:
      trials: 50
      altitude: 5
    random:
      n_episodes: 50
    information_gain:
      trials: 50
      communication: true

# ==================== 新设计5: 搜索专用状态表示 ====================
state_representation:
  # 发现历史图
  use_discovery_history: true
  discovery_influence_radius: 2
  
  # 探索强度图  
  use_exploration_intensity: true
  exploration_decay_factor: 0.9
  
  # 目标概率图
  use_target_probability: true
  
  # 搜索置信度图
  use_confidence_map: true
  confidence_update_rate: 0.1
  
  # 前沿图
  use_frontier_map: true
  frontier_kernel_size: 3
  
  # 联合搜索前景图
  use_joint_prospect: true
  prospect_fusion_method: "max"

evaluation:
  repetitions: 1
  metrics:
    # 基础指标
    - "num_waypoints"
    - "paths"
    - "rmse"
    - "wrmse"
    - "mll" 
    - "wmll"
    - "run_time"
    # 搜索专用指标
    - "target_discovery_rate"
    - "search_efficiency"
    - "collaboration_index"
    - "region_completion_rate"

networks:
  device: "cuda"
  type: "CNN"
  data_passes: 5           # 增加数据遍历（从3到5）：更充分学习
  batch_size: 128          # 增大batch size（从64到128）：更稳定训练
  batch_number: 4          # 增加batch数量（从3到4）
  copy_rate: 10
  gamma: 0.99
  lambda: 0.8
  actor:
    hidden_dim: 256        # 增大网络容量（从128到256）：学习复杂模式
    learning_rate: 0.0001  # 提高学习率（从0.00005到0.0001）：加快策略更新
    momentum: 0.9
    gradient_norm: 10
  critic:
    target_update_mode: "hard"
    tau: 0.01
    update_mode: "random_batches"
    synchronization: "no"
    fc1_dim: 128           # 增大网络容量（从64到128）
    learning_rate: 0.0005  # 提高学习率（从0.0003到0.0005）：更快价值估计
    momentum: 0.9
    gradient_norm: 10

classification:
  n_episodes: 300
  data_split: [0.4, 0.4, 0.2]
  number_epochs: 100
  batch_size: 50

# ==================== 可视化配置 ====================
visualization:
  # 障碍物配置 (用于在轨迹图中显示)
  # 与 experiment.obstacles.fixed_obstacles 对应
  obstacles:
    - x: 15
      y: 25
      z: 0
      height: 12
    
    - x: 35
      y: 15
      z: 0
      height: 15
    
    - x: 25
      y: 40
      z: 0
      height: 17
    
    - x: 20
      y: 12
      z: 0
      height: 8
    
    - x: 12
      y: 22
      z: 0
      height: 14
    
    - x: 38
      y: 18
      z: 0
      height: 11
    
    - x: 42
      y: 22
      z: 0
      height: 9
    
    - x: 28
      y: 18
      z: 0
      height: 13
    
    - x: 18
      y: 32
      z: 0
      height: 16
    
    - x: 40
      y: 38
      z: 0
      height: 22

# ==================== 配置说明 ====================
# 
# 🎯 完整功能集成:
# 
# 1. 稀疏奖励解决方案:
#    - 目标发现奖励: +50.0 (巨大即时奖励)
#    - 前沿探测奖励: 持续探索激励
#    - 协同发现奖励: 团队合作奖励
#    - 任务完成奖励: +100.0 终极目标
# 
# 2. 协同机制改进:
#    - 抗重叠惩罚: 避免路径/观测重复
#    - 区域分工: 鼓励智能体分散搜索
#    - 协同发现: 奖励多机协同搜索高优先级区域
#    - 通信成本: 研究通信约束下的性能
# 
# 3. 搜索专用状态表示 (9层输入):
#    - 预算图 + 位置图 + 智能体ID图
#    - 加权熵图 + 局部熵图 + 概率图 ⭐
#    - 足迹图 + 发现历史图 ⭐ + 探索强度图 ⭐
#
# 4. 区域搜索管理:
#    - 3个优先级区域 (高/中/低)
#    - 区域分工和协调
#    - 搜索密度控制
#    - 完成度跟踪
#
# 5. 前沿探测系统:
#    - 自动识别探索边界
#    - 距离奖励引导
#    - 前沿图状态表示
#
# 6. 障碍物避障系统: ⭐
#    - 3D圆柱形障碍物（树木、山峰等）
#    - 安全边界: 1.5米缓冲区
#    - 动作掩码: 自动屏蔽碰撞动作
#    - 智能逃生策略: 被困时选择最安全的动作
#    - 渐变惩罚: 基于距离的奖励塑形
#    - 碰撞检测: 实时路径验证
#    - 可视化: 3D + 俯视图显示障碍物
#    - 10个固定障碍物覆盖所有搜索区域
#
# 标准训练配置:
# - budget: 14步 (标准完整任务长度)
# - n_episodes: 1500 (充分训练以达到最优性能)
# - batch_size: 64 (标准batch size保证稳定学习)
# - data_passes: 3 (充分利用经验数据)
#
# 预期效果:
# - 总训练步数: ~7,143步
# - 预计时间: 24-36小时 (包含所有新功能)
# - GPU利用率: 30-50%
# - 模型性能: 95-100% (最优性能)
# - 功能验证: 完整覆盖所有创新点
